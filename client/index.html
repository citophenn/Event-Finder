<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Events Hub</title>

  <!-- Custom CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>

  <!-- Disclaimer: 67% of it is ChatGPT, 33% of it is my own work. Prompt: Create a HTML template for a Local Events Hub -->
   
  <!-- Header / Navigation -->
  <header class="bg-dark text-white p-3">
    <div class="container">
      <h1 class="h3 mb-0">Local Events Hub</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container my-4">

    <!-- Error / Status Messages -->
    <div id="status-message" class="alert d-none" role="alert"></div>

    <!-- Event List View -->
    <section id="event-list-view" class="centre">
      <h2 class="mb-3">Upcoming Events</h2>
      <!-- Loaded dynamically -->
      <div id="event-list" class="list-group">
        <!-- <li class="list-group-item">Event name</li> -->
      </div>
      <p></p>
      <button class="add-event" id = "add-event-btn" onclick="AddEventSectView()">+ Add Event</button>
      <button class="add-event" id="add-venue-btn" onclick="AddVenueSectView()">+ Add Venue</button>
    </section>

    <!-- Add Venue-->
    <section id="add-venue-view" class="card mt-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add New Venue</h2>

        <form method="post" id="add-venue-form">
          <!-- Venue Name -->
           <div class="mb-3">
            <label for="venue-name-input" class="form-label">Venue Name</label>
            <input
              type="text"
              name = "venuename"
              id="venue-name-input"
              class="form-control"
              placeholder="Enter venue name"
              required
            />          
          </div>

          <div class="mb-3">
            <label for="venue-address-input" class="form-label">Venue Address</label>
            <input
              type="text"
              name = "venueaddress"
              id="venue-address-input"
              class="form-control"
              placeholder="Enter venue adress"
              required
            />
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">
            Add Venue
          </button>
        </form>
      </div>
    </section>

    <!-- Add Event -->
    <section id="add-event-view" class="card mt-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add New Event</h2>

        <form method="post" id="add-event-form">
          <!-- Event Name -->
          <div class="mb-3">
            <label for="event-name-input" class="form-label">Event Name</label>
            <input
              type="text"
              name = "eventname"
              id="event-name-input"
              class="form-control"
              placeholder="Enter event name"
              required
            />
          </div>

          <!-- Event Date -->
          <div class="mb-3">
            <label for="event-date-input" class="form-label">Date</label>
            <input
              name = "eventdate"
              type="date"
              id="event-date-input"
              class="form-control"
              required
            />
          </div>

          <!-- Event Description -->
          <div class="mb-3">
            <label for="event-description-input" class="form-label">
              Description
            </label>
            <textarea
              name ="eventdesc"
              id="event-description-input"
              class="form-control"
              rows="3"
              placeholder="Describe the event"
              required
            ></textarea>
          </div>

          <!-- Venue Selection -->
          <div class="mb-3">
            <label for="event-venue-select" class="form-label">Venue</label>
            <select
              name="venue"
              id="event-venue-select"
              class="form-select"
              required
            >
              <option value="">Select a venue</option>
              <!-- Loaded dynamically via AJAX -->
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary" id="submit-btn">
            Add Event
          </button>
        </form>
      </div>
    </section>


    <!-- Event Detail View (hidden by default) -->
    <section id="detailed-event-view" class="d-none">
      <button id="back-button" class="btn-primary" onclick="HideEventSect(), ShowUpcomingEvents()">
        ← Back to events
      </button>
      <p></p>

      <!-- Event Info -->
      <div class="card mb-3">
        <div class="card-body">
          <h2 id="event-name" class="card-title"></h2>
          <p id="event-date" class="text-muted"></p>
          <p id="event-description"></p>
        </div>
      </div>

      <!-- Venue Info -->
      <div class="card mb-3">
        <div class="card-body">
          <h3 class="h5">Venue</h3>
          <p id="venue-name" class="mb-1"></p>
          <p id="venue-address" class="text-muted mb-0"></p>
        </div>
      </div>

      <!-- Comments -->
      <div class="card mb-3">
        <div class="card-body">
          <h3 class="h5">Comments</h3>

          <ul id="comment-list" class="list-group mb-3">
            <!-- Comments loaded via AJAX -->
          </ul>
          <!-- Add Comment Form -->
          <form id="comment-form">
            <div class="mb-2">
              <input
                type="text"
                id="comment-author"
                class="form-control"
                placeholder="Your name"
                required
              />
            </div>
            <div class="mb-2">
              <textarea
                id="comment-text"
                class="form-control"
                rows="3"
                placeholder="Your comment"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
              Add Comment
            </button>
          </form>
        </div>
      </div>
    </section>
    

  </main>

  <!-- Footer -->
  <footer class="bg-light text-center p-3">
    <small>&copy; 2026 Local Events Hub</small>
  </footer>

  <!-- Client-side JavaScript -->
  <script src="events.js"></script>
</body>
</html>
